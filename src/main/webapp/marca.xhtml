<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/template.xhtml"
                xmlns:p="primefaces"
                xmlns:si="jakarta.faces.composite/sicomp">
    <ui:param name="titulo" value="Gerenciar Marcas"></ui:param>
    <h:form id="form">
        <si:toolbarCrud crudBean="#{marcaBean}"></si:toolbarCrud>

        <p:panelGrid columns="2" rendered="#{marcaBean.estadoCrud != 'LISTAR'}">
            <p:outputLabel for="nome" value="Nome"></p:outputLabel>
            <p:inputText id="nome" value="#{marcaBean.entidade.nome}" required="true"></p:inputText>

            <p:outputLabel for="descricao" value="Descrição"></p:outputLabel>
            <p:inputTextarea id="descricao" value="#{marcaBean.entidade.descricao}" rows="3"></p:inputTextarea>

            <p:outputLabel for="ativo" value="Ativo"></p:outputLabel>
            <p:selectBooleanCheckbox id="ativo" value="#{marcaBean.entidade.ativo}"></p:selectBooleanCheckbox>
        </p:panelGrid>

        <p:dataTable value="#{marcaBean.entidades}" var="m" rendered="#{marcaBean.estadoCrud == 'LISTAR'}"
                     paginator="true" rows="10" filteredValue="#{marcaBean.entidades}">
            <p:column>
                <p:commandButton value="Editar" icon="pi pi-pencil" actionListener="#{marcaBean.editar(m)}" update=":form"></p:commandButton>
                <p:commandButton value="Excluir" icon="pi pi-trash" actionListener="#{marcaBean.excluir(m)}" update=":form">
                    <p:confirm header="Confirmação" message="Deseja realmente excluir a marca '#{m.nome}'?" icon="pi pi-exclamation-triangle"></p:confirm>
                </p:commandButton>
            </p:column>
            <p:column headerText="Id" sortBy="#{m.id}">
                #{m.id}
            </p:column>
            <p:column headerText="Nome" sortBy="#{m.nome}" filterBy="#{m.nome}">
                #{m.nome}
            </p:column>
            <p:column headerText="Descrição">
                #{m.descricao}
            </p:column>
            <p:column headerText="Ativo">
                <p:selectBooleanCheckbox value="#{m.ativo}" disabled="true"></p:selectBooleanCheckbox>
            </p:column>
        </p:dataTable>

        <p:confirmDialog global="true">
            <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times"></p:commandButton>
            <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"></p:commandButton>
        </p:confirmDialog>
    </h:form>
</ui:composition>
